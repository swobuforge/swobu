name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    env:
      GOWORK: off
      GOENV: off
      GOFLAGS: ''
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Check standalone public source
        run: make check
