<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fcfdfc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23050c12'/%3E%3Cg transform='translate(10 10) scale(.26042 .22936)'%3E%3Cpath d='M0 59.2 76.8 105.6v187.2l-49.6-38.4v-89.6l27.2 15.2v34.4L0 183.2Z' fill='%23f2f0e6'/%3E%3Cpath d='m153.6 0 78.4 44.8-49.6 28.8v217.6l-28.8 57.6-28.8-57.6V73.6L75.2 44.8Z' fill='%23c6ff00'/%3E%3Cpath d='m307.2 59.2-76.8 46.4v187.2l49.6-38.4v-89.6L252.8 180v34.4l54.4-31.2Z' fill='%23f2f0e6'/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">
  <title>Shared API — Swobu</title>
  <style>/* SWOBU_STYLES */</style>
  <script>/* SWOBU_QRCODE */</script>
  <script>/* SWOBU_APP */</script>
</head>
<body>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <main id="handoff-content" class="share-page">
    <header class="share-mast">
      <span class="share-brand">SWOBU</span>
      <span class="context">Shared API</span>
    </header>

    <section class="share-intro">
      <div class="share-title"><h1>Shared API</h1></div>
      <aside class="share-transfer">
        <div id="share-qr" class="share-qr" aria-label="QR code containing the complete invite URL"></div>
        <p>Open on another device</p>
      </aside>
    </section>
    <section class="share-recipes" aria-label="Connection recipes">
        <article class="share-recipe">
          <header class="recipe-id">
            <h2>OpenAI-compatible</h2>

            <button class="recipe-copy copy" data-copy="openai" aria-label="Copy complete OpenAI connection recipe">
              <svg class="i copy-normal" viewBox="0 0 256 256" aria-hidden="true"><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8Zm-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></svg>
              <svg class="i copy-done" viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69 218.34 66.34a8 8 0 0 1 11.32 11.32Z"/></svg>
            </button>
          </header>

          <div class="recipe-data">
            <div class="recipe-field">
              <span class="recipe-label">Base URL</span>
              <div class="recipe-value"><code data-openai></code></div>
            </div>
            <div class="recipe-field">
              <span class="recipe-label">API key</span>
              <div class="recipe-value"><code data-key></code>
              <button class="recipe-reveal reveal" data-reveal aria-pressed="false" aria-label="Reveal API key">
                <svg class="i eye-open" viewBox="0 0 256 256" aria-hidden="true"><path d="M247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48S61.43 61.26 36.34 86.35C17.51 105.18 9 124 8.69 124.76a8 8 0 0 0 0 6.5c.35.79 8.82 19.57 27.65 38.4C61.43 194.74 93.12 208 128 208s66.57-13.26 91.66-38.34c18.83-18.83 27.3-37.61 27.65-38.4A8 8 0 0 0 247.31 131.26ZM128 192c-30.78 0-57.67-11.19-79.93-33.25A133.47 133.47 0 0 1 25 128 133.33 133.33 0 0 1 48.07 97.25C70.33 75.19 97.22 64 128 64s57.67 11.19 79.93 33.25A133.46 133.46 0 0 1 231.05 128C223.84 141.46 192.43 192 128 192Zm0-112a48 48 0 1 0 48 48A48.05 48.05 0 0 0 128 80Zm0 80a32 32 0 1 1 32-32A32 32 0 0 1 128 160Z"/></svg>
                <svg class="i eye-closed" viewBox="0 0 256 256" aria-hidden="true"><path d="M53.92 34.62A8 8 0 1 0 42.08 45.38l19.24 21.17C25 88.84 9.38 123.2 8.69 124.76a8 8 0 0 0 0 6.5c.35.79 8.82 19.57 27.65 38.4C61.43 194.74 93.12 208 128 208a127.11 127.11 0 0 0 52.07-10.83l22 24.21a8 8 0 1 0 11.84-10.76Zm47.33 75.84 41.67 45.85a32 32 0 0 1-41.67-45.85ZM128 192c-30.78 0-57.67-11.19-79.93-33.25A133.16 133.16 0 0 1 25 128c4.69-8.79 19.66-33.39 47.35-49.38l18 19.75a48 48 0 0 0 63.66 70l14.73 16.2A112 112 0 0 1 128 192Z"/></svg>
              </button></div>
            </div>
          </div>
        </article>

        <article class="share-recipe anthropic">
          <header class="recipe-id">
            <h2>Anthropic-compatible</h2>

            <button class="recipe-copy copy" data-copy="anthropic" aria-label="Copy complete Anthropic connection recipe">
              <svg class="i copy-normal" viewBox="0 0 256 256" aria-hidden="true"><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8Zm-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></svg>
              <svg class="i copy-done" viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69 218.34 66.34a8 8 0 0 1 11.32 11.32Z"/></svg>
            </button>
          </header>

          <div class="recipe-data">
            <div class="recipe-field">
              <span class="recipe-label">Base URL</span>
              <div class="recipe-value"><code data-anthropic></code></div>
            </div>
            <div class="recipe-field">
              <span class="recipe-label">API key</span>
              <div class="recipe-value"><code data-key></code>
              <button class="recipe-reveal reveal" data-reveal aria-pressed="false" aria-label="Reveal API key">
                <svg class="i eye-open" viewBox="0 0 256 256" aria-hidden="true"><path d="M247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48S61.43 61.26 36.34 86.35C17.51 105.18 9 124 8.69 124.76a8 8 0 0 0 0 6.5c.35.79 8.82 19.57 27.65 38.4C61.43 194.74 93.12 208 128 208s66.57-13.26 91.66-38.34c18.83-18.83 27.3-37.61 27.65-38.4A8 8 0 0 0 247.31 131.26ZM128 192c-30.78 0-57.67-11.19-79.93-33.25A133.47 133.47 0 0 1 25 128 133.33 133.33 0 0 1 48.07 97.25C70.33 75.19 97.22 64 128 64s57.67 11.19 79.93 33.25A133.46 133.46 0 0 1 231.05 128C223.84 141.46 192.43 192 128 192Zm0-112a48 48 0 1 0 48 48A48.05 48.05 0 0 0 128 80Zm0 80a32 32 0 1 1 32-32A32 32 0 0 1 128 160Z"/></svg>
                <svg class="i eye-closed" viewBox="0 0 256 256" aria-hidden="true"><path d="M53.92 34.62A8 8 0 1 0 42.08 45.38l19.24 21.17C25 88.84 9.38 123.2 8.69 124.76a8 8 0 0 0 0 6.5c.35.79 8.82 19.57 27.65 38.4C61.43 194.74 93.12 208 128 208a127.11 127.11 0 0 0 52.07-10.83l22 24.21a8 8 0 1 0 11.84-10.76Zm47.33 75.84 41.67 45.85a32 32 0 0 1-41.67-45.85ZM128 192c-30.78 0-57.67-11.19-79.93-33.25A133.16 133.16 0 0 1 25 128c4.69-8.79 19.66-33.39 47.35-49.38l18 19.75a48 48 0 0 0 63.66 70l14.73 16.2A112 112 0 0 1 128 192Z"/></svg>
              </button></div>
            </div>
          </div>
        </article>
    </section>
  </main>

  <main id="missing-key" class="share-error" hidden>
    <div><span class="share-brand">SWOBU</span><h1>Incomplete share link</h1><p>Open the complete invite you received.</p></div>
  </main>
</body>
</html>
