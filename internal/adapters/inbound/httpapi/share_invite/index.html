<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fcfdfc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23050c12'/%3E%3Cg transform='translate(10 10) scale(.26042 .22936)'%3E%3Cpath d='M0 59.2 76.8 105.6v187.2l-49.6-38.4v-89.6l27.2 15.2v34.4L0 183.2Z' fill='%23f2f0e6'/%3E%3Cpath d='m153.6 0 78.4 44.8-49.6 28.8v217.6l-28.8 57.6-28.8-57.6V73.6L75.2 44.8Z' fill='%23c6ff00'/%3E%3Cpath d='m307.2 59.2-76.8 46.4v187.2l49.6-38.4v-89.6L252.8 180v34.4l54.4-31.2Z' fill='%23f2f0e6'/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">
  <title>Shared API — Swobu</title>
  <style>/* SWOBU_STYLES */</style>
  <script>/* SWOBU_QRCODE */</script>
  <script>/* SWOBU_APP */</script>
</head>
<body>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <main id="handoff-content" class="grid-template page">
    <header class="mast col-basic">
      <span class="brand">SWOBU</span>
      <span class="context">Shared API</span>
    </header>

    <section class="stage col-basic p-subgrid">
      <div class="intro-title col-span-two-thirds"><h1>Shared API</h1></div>
      <div class="recipes col-basic-recipes">
        <article class="recipe recipe-openai">
          <header class="recipe-head"><h2>OpenAI-compatible</h2></header>
          <div class="recipe-data">
            <div class="datum">
              <div class="datum-head">
                <span class="label">Base URL</span>
                <button class="text-action copy-value" data-copy-value="openai" aria-label="Copy OpenAI base URL">Copy</button>
              </div>
              <code data-openai></code>
            </div>
            <div class="datum key-datum">
              <div class="datum-head">
                <span class="label">API key</span>
                <div class="datum-actions">
                  <button class="text-action reveal" data-reveal aria-pressed="false" aria-label="Reveal API key">Reveal</button>
                  <button class="text-action copy-value" data-copy-value="key" aria-label="Copy API key">Copy</button>
                </div>
              </div>
              <code data-key></code>
            </div>
          </div>
        </article>

        <article class="recipe recipe-anthropic">
          <header class="recipe-head"><h2>Anthropic-compatible</h2></header>
          <div class="recipe-data">
            <div class="datum">
              <div class="datum-head">
                <span class="label">Base URL</span>
                <button class="text-action copy-value" data-copy-value="anthropic" aria-label="Copy Anthropic base URL">Copy</button>
              </div>
              <code data-anthropic></code>
            </div>
            <div class="datum key-datum">
              <div class="datum-head">
                <span class="label">API key</span>
                <div class="datum-actions">
                  <button class="text-action reveal" data-reveal aria-pressed="false" aria-label="Reveal API key">Reveal</button>
                  <button class="text-action copy-value" data-copy-value="key" aria-label="Copy API key">Copy</button>
                </div>
              </div>
              <code data-key></code>
            </div>
          </div>
        </article>
      </div>

      <aside class="transfer col-span-one-third">
        <div id="share-qr" class="qr" aria-label="QR code containing the complete invite URL"></div>
        <p>Open on another device</p>
      </aside>
    </section>
  </main>

  <main id="missing-key" class="missing" hidden>
    <div><span class="brand">SWOBU</span><h1>Incomplete share link</h1><p>Open the complete invite you received.</p></div>
  </main>
</body>
</html>
